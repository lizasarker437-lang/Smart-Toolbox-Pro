name: Build SR Smart Toolbox Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Android project (source tree or source ZIP)
        shell: bash
        run: |
          set -euo pipefail

          project_dir=""
          if [ -f app/build.gradle ]; then
            project_dir="."
          elif [ -f SmartToolboxPro/app/build.gradle ]; then
            project_dir="SmartToolboxPro"
          else
            mkdir -p source
            shopt -s nullglob
            source_archives=()

            # Only ZIPs containing an Android app module count as source archives.
            for archive in ./*.zip; do
              if unzip -Z1 "$archive" | grep -Eq '(^|/)app/build.gradle$'; then
                source_archives+=("$archive")
              fi
            done

            if [ "${#source_archives[@]}" -ne 1 ]; then
              echo "Expected exactly one Android source ZIP containing app/build.gradle; found ${#source_archives[@]}."
              echo "The ZIP must contain app/, settings.gradle and app/src/main/AndroidManifest.xml."
              echo "A ZIP containing only MP4 / PNG / TXT media assets is not an Android source project."
              echo "ZIP files found in repository:"
              for archive in ./*.zip; do
                [ -f "$archive" ] || continue
                echo "--- $archive"
                unzip -Z1 "$archive" | head -n 12 || true
              done
              exit 1
            fi

            archive="${source_archives[0]}"
            extraction_dir="source/$(basename "${archive%.zip}")"
            mkdir -p "$extraction_dir"
            unzip -q -o "$archive" -d "$extraction_dir"

            mapfile -t project_roots < <(
              find "$extraction_dir" -type f -path '*/app/build.gradle' -print |
              while IFS= read -r gradle_file; do
                dirname "$(dirname "$gradle_file")"
              done | sort -u
            )

            if [ "${#project_roots[@]}" -ne 1 ]; then
              echo "Could not identify exactly one Android project root inside $archive."
              printf '%s\\n' "${project_roots[@]}"
              exit 1
            fi
            project_dir="${project_roots[0]}"
          fi

          test -f "$project_dir/app/build.gradle"
          if [ ! -f "$project_dir/settings.gradle" ] && [ ! -f "$project_dir/settings.gradle.kts" ]; then
            echo "Android project is incomplete: settings.gradle or settings.gradle.kts is missing."
            exit 1
          fi
          test -f "$project_dir/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Building Android project in: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test edge-swipe direction and same-side restore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/edge-tests
          javac -d build/edge-tests \
            app/src/main/java/com/smarttoolbox/pro/EdgeSwipeLogic.java \
            tests/com/smarttoolbox/pro/EdgeSwipeLogicTest.java
          java -cp build/edge-tests com.smarttoolbox.pro.EdgeSwipeLogicTest

      - name: Verify SR branding and developer profile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java
          test -f app/src/main/res/drawable-nodpi/ic_launcher.png
          grep -q 'SR Smart Toolbox Pro' app/src/main/res/values/strings.xml
          grep -q 'Shahriar Rahman' app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java
          grep -q 'https://www.youtube.com/@SRCreation-farm' app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java
          grep -q 'https://fb.com/srcreation.farm' app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java
          grep -q 'AboutDeveloperActivity' app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'android:name=".AboutDeveloperActivity"' app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.smarttoolbox.pro'" app/build.gradle
          grep -q 'versionCode 17' app/build.gradle
          grep -q "versionName '1.4.2-alpha17'" app/build.gradle

      - name: Verify Android project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Check Java source for known invalid WindowManager flag
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if grep -R --line-number --fixed-strings 'FLAG_LAYOUT_NO_LIMIT,' app/src/main/java; then
            echo 'Invalid WindowManager flag found. Use FLAG_LAYOUT_NO_LIMITS.'
            exit 1
          fi
          grep -R --line-number --fixed-strings 'FLAG_LAYOUT_NO_LIMITS' app/src/main/java

      - name: Verify utility services and requested controls
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          test -f app/src/main/java/com/smarttoolbox/pro/FloatingIconSettingsActivity.java
          test -f app/src/main/java/com/smarttoolbox/pro/ThermalMonitorService.java
          test -f app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'android:name=".FloatingControlService"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".FloatingIconSettingsActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".ThermalMonitorService"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SystemAudioBoostService"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/main/AndroidManifest.xml
          grep -q 'new LoudnessEnhancer(0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'new Equalizer(0, 0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'new BassBoost(0, 0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'new Virtualizer(0, 0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'ACTION_UPDATE_EQ' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'applyFiveBandEqualizer' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'Bass Boost' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java
          grep -q 'Virtualizer / Spatial Effect' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java
          grep -q 'PRESET_NAMES' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java
          grep -q 'ACTION_MASTER_ON' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'ACTION_MASTER_OFF' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'thermal.battery' app/src/main/java/com/smarttoolbox/pro/ThermalMonitorService.java
          grep -q 'floating.auto_hide_seconds' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'floating.edge.width' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          # Edge swipe gesture, same-side restore, and native media volume controls.
          grep -q 'handleEdgeGesture' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'restoreBubbleFromEdge(true)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'PANEL_IDLE_TIMEOUT_MS = 3000L' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'FLAG_WATCH_OUTSIDE_TOUCH' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'MotionEvent.ACTION_OUTSIDE' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'dismissPanelFromOutsideTouch' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          test -f app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'NotificationControlsActivity' app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'android:name=".NotificationControlsActivity"' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_CHANNEL_NOTIFICATION_SETTINGS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'ACTION_APP_NOTIFICATION_SETTINGS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'ACTION_ALL_APPS_NOTIFICATION_SETTINGS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'POST_NOTIFICATIONS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'EdgeSwipeLogic.isInwardSwipe' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'restoreBubbleFromEdge(true)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addNativeMediaVolumeControls(masterCard)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'AudioManager.ADJUST_RAISE' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'AudioManager.ADJUST_LOWER' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'AudioManager.STREAM_MUSIC' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          if grep -q 'android.permission.WRITE_SETTINGS' app/src/main/AndroidManifest.xml; then exit 1; fi
          if grep -q 'Display brightness' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java; then exit 1; fi
          grep -q 'floating.size' app/src/main/java/com/smarttoolbox/pro/FloatingIconSettingsActivity.java
          grep -q 'addPanelFeatureHeaderTo(nightCard' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addPanelSliderTo(' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          # Prevent a regression of the missing listener/formatter compile error.
          grep -q 'private interface PanelSliderFormatter' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'private interface PanelSliderListener' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'void onChange(int value)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'void onRelease(int value)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addPanelFeatureHeaderTo(thermalCard' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addPanelFeatureHeaderTo(masterCard' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addPanelActionTo(scannerCard' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'BarcodeScannerActivity.class' app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'GmsBarcodeScanning.getClient' app/src/main/java/com/smarttoolbox/pro/BarcodeScannerActivity.java
          grep -q 'enableAutoZoom' app/src/main/java/com/smarttoolbox/pro/BarcodeScannerActivity.java
          grep -q 'play-services-code-scanner:16.1.0' app/build.gradle
          grep -q 'android:value="barcode_ui"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".BarcodeScannerActivity"' app/src/main/AndroidManifest.xml
          if grep -R -q 'DocumentScannerActivity\|text-recognition:16.0.1\|Create PDF\|Extract text (OCR)' app/src/main app/build.gradle; then exit 1; fi
          grep -q 'Close quick controls' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'schedulePanelAutoClose' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'cancelPanelAutoClose' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'panelAutoCloseRunnable' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          if grep -Eq 'Floating icon settings|Hide floating icon|Close panel' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java; then exit 1; fi
          grep -q 'floating.size' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'floating.opacity' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addPanelSliderTo(' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'import android.os.Handler;' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'import android.os.Looper;' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'scheduleNightLevelUpdate' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'scheduleAudioGainUpdate' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'DimOverlayService.class' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'SystemAudioBoostService.ACTION_UPDATE' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'showEdgeHandleFromSavedPosition' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'restoreBubbleFromEdge' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'floating.auto_hide' app/src/main/java/com/smarttoolbox/pro/FloatingIconSettingsActivity.java
          grep -q 'floating.auto_hidden' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'available (even when all tools are OFF)' app/src/main/java/com/smarttoolbox/pro/FloatingIconSettingsActivity.java
          if grep -R --line-number 'setStreamVolume' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java; then
            echo 'The system volume slider must not be changed by this app.'
            exit 1
          fi

      - name: Verify SR Video Player integration and pure-Java tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          test -f app/src/main/java/com/smarttoolbox/pro/VideoPlaybackService.java
          test -f app/src/main/java/com/smarttoolbox/pro/VideoPlayerLogic.java
          test -f tests/com/smarttoolbox/pro/VideoPlayerLogicTest.java
          grep -q "def media3Version = '1.11.1'" app/build.gradle
          grep -q 'androidx.media3:media3-exoplayer:' app/build.gradle
          grep -q 'androidx.media3:media3-session:' app/build.gradle
          grep -q 'androidx.media3:media3-ui:' app/build.gradle
          grep -q 'androidx.media3:media3-exoplayer-hls:' app/build.gradle
          grep -q 'androidx.media3:media3-exoplayer-dash:' app/build.gradle
          grep -q 'androidx.media3:media3-exoplayer-smoothstreaming:' app/build.gradle
          grep -q 'androidx.media3:media3-exoplayer-rtsp:' app/build.gradle
          grep -q 'android:name=".VideoPlayerActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".VideoPlaybackService"' app/src/main/AndroidManifest.xml
          grep -q 'androidx.media3.session.MediaSessionService' app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="mediaPlayback"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'VideoLibraryActivity.class' app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'openVideoPlayer' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'setSubtitleConfigurations' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'TrackSelectionOverride' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'enterPictureInPictureMode' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'scheduleSleepTimer' app/src/main/java/com/smarttoolbox/pro/VideoPlaybackService.java
          grep -q 'setWakeMode(C.WAKE_MODE_LOCAL)' app/src/main/java/com/smarttoolbox/pro/VideoPlaybackService.java
          grep -q 'setKeepScreenOn(isPlaying)' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'playerView.setUseController(false)' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'topPanel' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'quickActions' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'positionSeekBar' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'centerTransport' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'scheduleControlsAutoHide' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'CONTROL_HIDE_DELAY_MS = 3200L' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'PixelCopy.request' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'onDoubleTap' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'onScroll' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'toggleAudioOnly' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE)' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'getUriFromItem' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'compileSdk 36' app/build.gradle
          grep -q "version '8.10.0'" build.gradle
          grep -q 'MediaController.releaseFuture' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'PANEL_IDLE_TIMEOUT_MS = 3000L' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          mkdir -p build/video-player-tests
          javac -d build/video-player-tests \
            app/src/main/java/com/smarttoolbox/pro/VideoPlayerLogic.java \
            tests/com/smarttoolbox/pro/VideoPlayerLogicTest.java
          java -cp build/video-player-tests com.smarttoolbox.pro.VideoPlayerLogicTest

      - name: Verify phone video library and independent resume tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/smarttoolbox/pro/VideoLibraryActivity.java
          test -f app/src/main/java/com/smarttoolbox/pro/VideoResumeStore.java
          test -f app/src/main/java/com/smarttoolbox/pro/VideoResumeLogic.java
          test -f tests/com/smarttoolbox/pro/VideoResumeLogicTest.java
          grep -q 'android:name=".VideoLibraryActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_MEDIA_VIDEO' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_MEDIA_VISUAL_USER_SELECTED' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'MediaStore.Video.Media.getContentUri' app/src/main/java/com/smarttoolbox/pro/VideoLibraryActivity.java
          grep -q 'VideoResumeStore.get' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'VideoResumeStore.put' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'EXTRA_VIDEO_URI' app/src/main/java/com/smarttoolbox/pro/VideoLibraryActivity.java
          grep -q 'EXTRA_RESTART_VIDEO' app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          mkdir -p build/video-resume-tests
          javac -d build/video-resume-tests \
            app/src/main/java/com/smarttoolbox/pro/VideoResumeLogic.java \
            tests/com/smarttoolbox/pro/VideoResumeLogicTest.java
          java -cp build/video-resume-tests com.smarttoolbox.pro.VideoResumeLogicTest

      - name: Verify requested feature updates
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -q 'dimSeek.setMax(95)' app/src/main/java/com/smarttoolbox/pro/NightScreenActivity.java
          grep -q 'LoudnessEnhancer' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'TYPE_APPLICATION_OVERLAY' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'FloatingIconSettingsActivity' app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'FLAG_LAYOUT_NO_LIMITS' app/src/main/java/com/smarttoolbox/pro/DimOverlayService.java

      - name: Verify Kotlin standard library alignment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --console=plain :app:dependencyInsight --dependency kotlin-stdlib-jdk7 --configuration debugRuntimeClasspath
          gradle --no-daemon --console=plain :app:dependencyInsight --dependency kotlin-stdlib-jdk8 --configuration debugRuntimeClasspath

      - name: Check duplicate Android classes
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:checkDebugDuplicateClasses

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build-debug.log

      - name: Print Java compiler errors (if build fails)
        working-directory: ${{ env.PROJECT_DIR }}
        if: failure()
        shell: bash
        run: |
          if [ -f build-debug.log ]; then
            echo '=== Java compiler error locations ==='
            grep -n -E '\.java:[0-9]+: error:|^error:|cannot find symbol|symbol:|location:' build-debug.log | head -n 100 || true
            echo '=== Last 80 build log lines ==='
            tail -n 80 build-debug.log
          fi

      - name: Save build log (if build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SR-Smart-Toolbox-Pro-build-errors
          path: ${{ env.PROJECT_DIR }}/build-debug.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK was created
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-Smart-Toolbox-Pro-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
