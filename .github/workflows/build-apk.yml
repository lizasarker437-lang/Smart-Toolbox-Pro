name: Build Smart Toolbox Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4 + explicit packages avoids requesting the removed SDK package "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Verify uploaded source archive
        run: |
          if [ ! -s "SmartToolboxPro_GitHub.zip" ]; then
            echo "::error::SmartToolboxPro_GitHub.zip was not found in the repository root."
            exit 1
          fi
          unzip -t "SmartToolboxPro_GitHub.zip"

      - name: Extract project
        run: |
          rm -rf source
          mkdir -p source
          unzip -q "SmartToolboxPro_GitHub.zip" -d source
          test -f source/SmartToolboxPro/settings.gradle
          test -f source/SmartToolboxPro/app/build.gradle
          test -f source/SmartToolboxPro/app/src/main/AndroidManifest.xml

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/SmartToolboxPro
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK was created
        run: test -s source/SmartToolboxPro/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartToolboxPro-debug-apk
          path: source/SmartToolboxPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
