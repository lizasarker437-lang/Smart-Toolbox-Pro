name: Build SR Smart Toolbox Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Android project (source tree or source ZIP)
        shell: bash
        run: |
          set -euo pipefail

          project_dir=""
          if [ -f app/build.gradle ]; then
            project_dir="."
          elif [ -f SmartToolboxPro/app/build.gradle ]; then
            project_dir="SmartToolboxPro"
          else
            mkdir -p source
            shopt -s nullglob
            source_archives=()

            # Only ZIPs containing an Android app module count as source archives.
            for archive in ./*.zip; do
              if unzip -Z1 "$archive" | grep -Eq '(^|/)app/build.gradle$'; then
                source_archives+=("$archive")
              fi
            done

            if [ "${#source_archives[@]}" -ne 1 ]; then
              echo "Expected exactly one Android source ZIP containing app/build.gradle; found ${#source_archives[@]}."
              echo "The ZIP must contain app/, settings.gradle and app/src/main/AndroidManifest.xml."
              echo "A ZIP containing only MP4 / PNG / TXT media assets is not an Android source project."
              echo "ZIP files found in repository:"
              for archive in ./*.zip; do
                [ -f "$archive" ] || continue
                echo "--- $archive"
                unzip -Z1 "$archive" | head -n 12 || true
              done
              exit 1
            fi

            archive="${source_archives[0]}"
            extraction_dir="source/$(basename "${archive%.zip}")"
            mkdir -p "$extraction_dir"
            unzip -q -o "$archive" -d "$extraction_dir"

            mapfile -t project_roots < <(
              find "$extraction_dir" -type f -path '*/app/build.gradle' -print |
              while IFS= read -r gradle_file; do
                dirname "$(dirname "$gradle_file")"
              done | sort -u
            )

            if [ "${#project_roots[@]}" -ne 1 ]; then
              echo "Could not identify exactly one Android project root inside $archive."
              printf '%s\\n' "${project_roots[@]}"
              exit 1
            fi
            project_dir="${project_roots[0]}"
          fi

          test -f "$project_dir/app/build.gradle"
          if [ ! -f "$project_dir/settings.gradle" ] && [ ! -f "$project_dir/settings.gradle.kts" ]; then
            echo "Android project is incomplete: settings.gradle or settings.gradle.kts is missing."
            exit 1
          fi
          test -f "$project_dir/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Building Android project in: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test edge-swipe direction and same-side restore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build/edge-tests
          javac -d build/edge-tests \
            app/src/main/java/com/smarttoolbox/pro/EdgeSwipeLogic.java \
            tests/com/smarttoolbox/pro/EdgeSwipeLogicTest.java
          java -cp build/edge-tests com.smarttoolbox.pro.EdgeSwipeLogicTest

      - name: Verify integrated compact controls, colors and clipped toolbox
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          src=app/src/main/java/com/smarttoolbox/pro
          test -f "$src/CompactFeatureBar.java"
          test -f "$src/CompactControlMath.java"
          grep -q 'setClipToOutline(true)' "$src/FloatingControlService.java"
          grep -q 'setClipChildren(true)' "$src/FloatingControlService.java"
          grep -q 'addCompactLevelControl("Night Screen"' "$src/FloatingControlService.java"
          grep -q 'addCompactLevelControl("Volume Boost"' "$src/FloatingControlService.java"
          grep -q 'addCompactToggleControl("Thermal"' "$src/FloatingControlService.java"
          grep -q 'addNativeMediaVolumeControls(panelContent' "$src/FloatingControlService.java"
          grep -q 'CompactControlMath.isHorizontalDrag' "$src/CompactFeatureBar.java"
          grep -q 'CompactControlMath.levelFromTouch' "$src/CompactFeatureBar.java"
          grep -q 'onToggle()' "$src/CompactFeatureBar.java"
          grep -q 'Ui.GREEN' "$src/CompactFeatureBar.java"
          grep -q 'Ui.ACCENT' "$src/CompactFeatureBar.java"
          grep -q 'panelHeight(' "$src/CompactControlMath.java"
          if grep -q 'addPanelSliderTo(' "$src/FloatingControlService.java"; then
            echo 'Old duplicated slider rows must not be rendered.'; exit 1
          fi
          mkdir -p build/compact-control-tests
          javac -d build/compact-control-tests \
            "$src/CompactControlMath.java" "$src/ToolboxPanelSize.java" \
            tests/com/smarttoolbox/pro/CompactControlMathTest.java
          java -cp build/compact-control-tests com.smarttoolbox.pro.CompactControlMathTest

      - name: Verify resizable floating toolbox panel and Java sizing tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          src=app/src/main/java/com/smarttoolbox/pro
          test -f "$src/ToolboxPanelSize.java"
          grep -q 'floating.toolbox.width_dp' "$src/FloatingIconSettingsActivity.java"
          grep -q 'floating.toolbox.height_dp' "$src/FloatingIconSettingsActivity.java"
          grep -q 'Toolbox width:' "$src/FloatingIconSettingsActivity.java"
          grep -q 'Maximum toolbox height:' "$src/FloatingIconSettingsActivity.java"
          grep -q 'Reset toolbox size' "$src/FloatingIconSettingsActivity.java"
          grep -q 'ToolboxPanelSize.fitToScreenPx' "$src/FloatingControlService.java"
          grep -q 'ToolboxPanelSize.clampTopY' "$src/FloatingControlService.java"
          test -f tests/com/smarttoolbox/pro/ToolboxPanelSizeTest.java
          mkdir -p build/toolbox-size-tests
          javac -d build/toolbox-size-tests \
            "$src/ToolboxPanelSize.java" \
            tests/com/smarttoolbox/pro/ToolboxPanelSizeTest.java
          java -cp build/toolbox-size-tests com.smarttoolbox.pro.ToolboxPanelSizeTest

      - name: Verify immersive video playback and deliberate background audio
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          main=app/src/main/java/com/smarttoolbox/pro/VideoPlayerActivity.java
          grep -q 'WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' "$main"
          grep -q 'controller.hide(WindowInsetsCompat.Type.systemBars())' "$main"
          grep -q 'exitPlayerAndStop()' "$main"
          grep -q 'exitPlayerKeepingAudio()' "$main"
          grep -q 'if (!controller.isPlaying()) controller.play()' "$main"
          grep -q 'registerSystemBack()' "$main"
          grep -q 'unregisterSystemBack()' "$main"
          grep -q 'Background audio - exit player' "$main"
          test -f app/src/main/java/com/smarttoolbox/pro/VideoPlaybackService.java
          grep -q 'controller.clearMediaItems()' "$main"
          grep -q 'VideoPlaybackService.stopCurrentPlayback()' "$main"
          grep -q 'public static void stopCurrentPlayback()' app/src/main/java/com/smarttoolbox/pro/VideoPlaybackService.java
          test -f tests/com/smarttoolbox/pro/VideoExitPolicyTest.java
          mkdir -p build/video-exit-tests
          javac -d build/video-exit-tests \
            app/src/main/java/com/smarttoolbox/pro/VideoExitPolicy.java \
            tests/com/smarttoolbox/pro/VideoExitPolicyTest.java
          java -cp build/video-exit-tests com.smarttoolbox.pro.VideoExitPolicyTest

      - name: Verify SR branding and developer profile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== ACTUAL SOURCE FROM THE ZIP (not workflow file) ====='
          pwd
          if [ -f app/build.gradle ]; then
            grep -E '^[[:space:]]*(applicationId|versionCode|versionName)[[:space:]]+' app/build.gradle || true
          fi
          echo '=========================================================='

          fail() {
            echo "::error title=Branding source verification::$1"
            exit 1
          }
          require_file() {
            [ -f "$1" ] || fail "Missing file: $1. Replace the repository's SmartToolboxPro_GitHub.zip with the matching source ZIP."
            echo "OK file: $1"
          }
          require_text() {
            local pattern="$1" file="$2" label="$3"
            grep -Fq -- "$pattern" "$file" || fail "$label is missing in $file. Your source ZIP may be older than the workflow."
            echo "OK: $label"
          }

          require_file 'app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java'
          require_file 'app/src/main/res/drawable-nodpi/ic_launcher.png'
          require_file 'app/src/main/res/values/strings.xml'
          require_file 'app/src/main/java/com/smarttoolbox/pro/MainActivity.java'
          require_file 'app/src/main/AndroidManifest.xml'
          require_file 'app/build.gradle'

          require_text 'SR Smart Toolbox Pro' 'app/src/main/res/values/strings.xml' 'Branded application name'
          require_text 'Shahriar Rahman' 'app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java' 'Developer credit'
          require_text 'https://www.youtube.com/@SRCreation-farm' 'app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java' 'YouTube link'
          require_text 'https://fb.com/srcreation.farm' 'app/src/main/java/com/smarttoolbox/pro/AboutDeveloperActivity.java' 'Facebook link'
          require_text 'AboutDeveloperActivity' 'app/src/main/java/com/smarttoolbox/pro/MainActivity.java' 'About navigation'
          require_text 'android:name=".AboutDeveloperActivity"' 'app/src/main/AndroidManifest.xml' 'About activity registration'
          require_text "applicationId 'com.smarttoolbox.pro'" 'app/build.gradle' 'App identity'

          # Version metadata must be valid, but MUST NOT be hard-coded in the workflow.
          # Hard-coded alpha/versionCode values previously caused false CI failures
          # when the ZIP and workflow were uploaded separately from a mobile phone.
          grep -Eq '^[[:space:]]*versionCode[[:space:]]+[0-9]+' app/build.gradle || fail 'Invalid/missing versionCode in app/build.gradle'
          grep -Eq "^[[:space:]]*versionName[[:space:]]+['\"][^'\"]+['\"]" app/build.gradle || fail 'Invalid/missing versionName in app/build.gradle'
          echo 'Branding verification passed against the actual Android source.'

      - name: Verify smart three-dot menu and home navigation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          main=app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'new PopupMenu(this, anchor)' "$main"
          grep -q 'showOverflowMenu(overflow)' "$main"
          grep -q 'MENU_FLOATING_SETTINGS' "$main"
          grep -q 'MENU_NOTIFICATION_CONTROLS' "$main"
          grep -q 'MENU_ANDROID_APP_SETTINGS' "$main"
          grep -q 'MENU_ABOUT_DEVELOPER' "$main"
          grep -q 'MENU_THEME_SETTINGS' "$main"
          grep -q 'ThemeSettingsActivity.class' "$main"
          grep -q 'FloatingIconSettingsActivity.class' "$main"
          grep -q 'NotificationControlsActivity.class' "$main"
          grep -q 'AboutDeveloperActivity.class' "$main"
          grep -q 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' "$main"
          grep -q 'VideoLibraryActivity.class' "$main"
          grep -q 'NightScreenActivity.class' "$main"
          grep -q 'VolumeBoosterActivity.class' "$main"
          grep -q 'ThermalMonitorActivity.class' "$main"
          grep -q 'BarcodeScannerActivity.class' "$main"
          if grep -q 'Ui.addCard(this, body, brandCard' "$main"; then exit 1; fi
          if grep -q 'Ui.addCard(this, body, floatingCard' "$main"; then exit 1; fi
          if grep -q 'Ui.addCard(this, body, notificationCard' "$main"; then exit 1; fi

      - name: Verify themes and folder-first video browser
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          java_dir=app/src/main/java/com/smarttoolbox/pro
          test -f "$java_dir/ThemePalette.java"
          test -f "$java_dir/ThemeManager.java"
          test -f "$java_dir/ThemeSettingsActivity.java"
          test -f "$java_dir/VideoFolderLogic.java"
          grep -q 'android:name=".SrToolboxApp"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".ThemeSettingsActivity"' app/src/main/AndroidManifest.xml
          grep -q 'AppThemeLight' app/src/main/res/values/styles.xml
          grep -q 'ThemeManager.applyToActivity' "$java_dir/MainActivity.java"
          grep -q 'ThemeManager.save' "$java_dir/ThemeSettingsActivity.java"
          grep -q 'ThemeManager.saveAppearance' "$java_dir/ThemeSettingsActivity.java"
          grep -q 'ThemeManager.MODE_SYSTEM' "$java_dir/ThemeSettingsActivity.java"
          grep -q 'ThemeManager.MODE_LIGHT' "$java_dir/ThemeSettingsActivity.java"
          grep -q 'ThemeManager.MODE_DARK' "$java_dir/ThemeSettingsActivity.java"
          grep -q 'ThemePalette.count()' "$java_dir/ThemeSettingsActivity.java"
          grep -q 'static final String\[\] NAMES' "$java_dir/ThemePalette.java"
          grep -q 'ThemeManager.styleKey' "$java_dir/MainActivity.java"
          grep -q 'ThemeManager.initialize(this)' "$java_dir/FloatingControlService.java"
          grep -q 'ThemeManager.isLight(this)' "$java_dir/FloatingControlService.java"
          grep -q 'Ui.ACCENT' "$java_dir/FloatingControlService.java"
          grep -q 'FloatingControlService.refresh(context)' "$java_dir/ThemeManager.java"
          grep -q 'VideoFolderLogic.displayName' "$java_dir/VideoLibraryActivity.java"
          grep -q 'new GridView(this)' "$java_dir/VideoLibraryActivity.java"
          grep -q 'new ListView(this)' "$java_dir/VideoLibraryActivity.java"
          # Regression guard: prevent undefined VideoLibraryActivity fields (previous 15 javac errors).
          grep -q 'private VideoAdapter adapter;' "$java_dir/VideoLibraryActivity.java"
          grep -q 'private TextView status;' "$java_dir/VideoLibraryActivity.java"
          grep -q 'private VideoFolderAdapter folderAdapter;' "$java_dir/VideoLibraryActivity.java"
          grep -q 'private VideoFolderGridAdapter folderGridAdapter;' "$java_dir/VideoLibraryActivity.java"
          grep -q 'MODE_CONTINUE' "$java_dir/VideoLibraryActivity.java"
          grep -q 'VideoResumeStore.get' "$java_dir/VideoLibraryActivity.java"
          test -f "$java_dir/VideoThumbnailLoader.java"
          grep -q 'ContentResolver' "$java_dir/VideoThumbnailLoader.java"
          grep -q 'loadThumbnail(uri' "$java_dir/VideoThumbnailLoader.java"
          grep -q 'VideoResumeStore.get' "$java_dir/VideoLibraryActivity.java"
          grep -q 'EXTRA_CONTINUE_LAST' "$java_dir/VideoLibraryActivity.java"
          grep -q 'EXTRA_CONTINUE_LAST' "$java_dir/VideoPlayerActivity.java"
          grep -q 'showVideoOptions' "$java_dir/VideoLibraryActivity.java"
          grep -q 'continueButton' "$java_dir/VideoLibraryActivity.java"
          grep -q 'thumbnails.load(holder.thumbnail' "$java_dir/VideoLibraryActivity.java"
          # Version is validated once in the branding step, without pinning a release number.
          mkdir -p build/theme-folder-tests
          javac -d build/theme-folder-tests \
            "$java_dir/ThemePalette.java" \
            "$java_dir/VideoFolderLogic.java" \
            tests/com/smarttoolbox/pro/ThemePaletteTest.java \
            tests/com/smarttoolbox/pro/VideoFolderLogicTest.java
          java -cp build/theme-folder-tests com.smarttoolbox.pro.ThemePaletteTest
          java -cp build/theme-folder-tests com.smarttoolbox.pro.VideoFolderLogicTest

      - name: Verify all Java source syntax and duplicate fields
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          mkdir -p build/java-syntax-tests
          javac -d build/java-syntax-tests \
            tests/com/smarttoolbox/pro/JavaSourceSyntaxTest.java
          java -cp build/java-syntax-tests com.smarttoolbox.pro.JavaSourceSyntaxTest \
            app/src/main/java

      - name: Verify video library Java field declarations
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          mkdir -p build/library-fields-tests
          javac -d build/library-fields-tests \
            tests/com/smarttoolbox/pro/VideoLibrarySourceFieldsTest.java
          java -cp build/library-fields-tests com.smarttoolbox.pro.VideoLibrarySourceFieldsTest \
            app/src/main/java/com/smarttoolbox/pro/VideoLibraryActivity.java

      - name: Test floating sidebar animation calculations
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bubble-animation-tests
          javac -d build/bubble-animation-tests \
            app/src/main/java/com/smarttoolbox/pro/BubbleSlideLogic.java \
            tests/com/smarttoolbox/pro/BubbleSlideLogicTest.java
          java -cp build/bubble-animation-tests com.smarttoolbox.pro.BubbleSlideLogicTest

      - name: Verify Android project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Check Java source for known invalid WindowManager flag
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          if grep -R --line-number --fixed-strings 'FLAG_LAYOUT_NO_LIMIT,' app/src/main/java; then
            echo 'Invalid WindowManager flag found. Use FLAG_LAYOUT_NO_LIMITS.'
            exit 1
          fi
          grep -R --line-number --fixed-strings 'FLAG_LAYOUT_NO_LIMITS' app/src/main/java

      - name: Verify utility services and requested controls
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=Source check failed::Failed check (line $LINENO): $BASH_COMMAND [exit $code]"; exit $code' ERR
          test -f app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          test -f app/src/main/java/com/smarttoolbox/pro/FloatingIconSettingsActivity.java
          test -f app/src/main/java/com/smarttoolbox/pro/ThermalMonitorService.java
          test -f app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'android:name=".FloatingControlService"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".FloatingIconSettingsActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".ThermalMonitorService"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".SystemAudioBoostService"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/main/AndroidManifest.xml
          grep -q 'new LoudnessEnhancer(0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'new Equalizer(0, 0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'new BassBoost(0, 0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'new Virtualizer(0, 0)' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'ACTION_UPDATE_EQ' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'applyFiveBandEqualizer' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'Bass Boost' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java
          grep -q 'Virtualizer / Spatial Effect' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java
          grep -q 'PRESET_NAMES' app/src/main/java/com/smarttoolbox/pro/VolumeBoosterActivity.java
          grep -q 'ACTION_MASTER_ON' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'ACTION_MASTER_OFF' app/src/main/java/com/smarttoolbox/pro/SystemAudioBoostService.java
          grep -q 'thermal.battery' app/src/main/java/com/smarttoolbox/pro/ThermalMonitorService.java
          grep -q 'floating.auto_hide_seconds' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'floating.edge.width' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          # Edge swipe gesture, same-side restore, and native media volume controls.
          grep -q 'handleEdgeGesture' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'animateBubbleFromEdge' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'ValueAnimator.ofFloat(0f, 1f)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'panel.animate().alpha(1f).translationX(0f)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'restoreBubbleFromEdge(true)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'PANEL_IDLE_TIMEOUT_MS = 3000L' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'FLAG_WATCH_OUTSIDE_TOUCH' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'MotionEvent.ACTION_OUTSIDE' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'dismissPanelFromOutsideTouch' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          test -f app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'NotificationControlsActivity' app/src/main/java/com/smarttoolbox/pro/MainActivity.java
          grep -q 'android:name=".NotificationControlsActivity"' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_CHANNEL_NOTIFICATION_SETTINGS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'ACTION_APP_NOTIFICATION_SETTINGS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'ACTION_ALL_APPS_NOTIFICATION_SETTINGS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'POST_NOTIFICATIONS' app/src/main/java/com/smarttoolbox/pro/NotificationControlsActivity.java
          grep -q 'EdgeSwipeLogic.isInwardSwipe' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'restoreBubbleFromEdge(true)' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'addNativeMediaVolumeControls(panelContent' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'AudioManager.ADJUST_RAISE' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'AudioManager.ADJUST_LOWER' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          grep -q 'AudioManager.STREAM_MUSIC' app/src/main/java/com/smarttoolbox/pro/FloatingControlService.java
          # WRITE_SETTINGS is now explicitly user-authorized for optional minimum
          # brightness. Verify its caller checks Settings.System.canWrite first.
          grep -q 'android.permission.WRITE_SETTINGS' app/src/main/AndroidManifest.xml
          grep -Fq 'Settings.System.canWrite(context)' app/src/main/java/com/smarttoolbox/pro/NightBrightnessController.java
