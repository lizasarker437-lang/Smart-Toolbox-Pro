
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(
              os.environ["GITHUB_WORKSPACE"]
          ).resolve()

          extracted = root / "_android_extracted"
          extracted.mkdir(exist_ok=True)

          def find_project():
              matches = []
              for name in (
                  "settings.gradle",
                  "settings.gradle.kts"
              ):
                  for file in root.rglob(name):
                      if ".git" in file.parts:
                          continue
                      folder = file.parent
                      if (
                          (folder / "app/build.gradle").is_file()
                          or
                          (folder / "app/build.gradle.kts").is_file()
                      ):
                          matches.append(folder)
              return sorted(
                  set(matches),
                  key=lambda p: (len(p.parts), str(p))
              )

          projects = find_project()

          if not projects:
              processed = set()

              for round_number in range(5):
                  archives = sorted(root.rglob("*.zip"))
                  pending = [
                      p for p in archives
                      if p not in processed
                      and ".git" not in p.parts
                  ]

                  if not pending:
                      break

                  for index, archive in enumerate(pending):
                      processed.add(archive)

                      print("Checking:", archive)

                      try:
                          with zipfile.ZipFile(archive) as z:
                              destination = (
                                  extracted
                                  / ("round_" + str(round_number))
                                  / str(index)
                              )
                              destination.mkdir(
                                  parents=True,
                                  exist_ok=True
                              )

                              base = destination.resolve()

                              for item in z.infolist():
                                  target = (
                                      base / item.filename
                                  ).resolve()

                                  if not target.is_relative_to(base):
                                      raise ValueError(
                                          "Unsafe ZIP path"
                                      )

                                  if item.is_dir():
                                      target.mkdir(
                                          parents=True,
                                          exist_ok=True
                                      )
                                  else:
                                      target.parent.mkdir(
                                          parents=True,
                                          exist_ok=True
                                      )
                                      with z.open(item) as src:
                                          with open(target, "wb") as dst:
                                              import shutil
                                              shutil.copyfileobj(src, dst)

                      except (zipfile.BadZipFile, ValueError) as e:
                          print("ZIP error:", e)
                          continue

                  projects = find_project()
                  if projects:
                      break

          if not projects:
              print("Repository files:")
              for p in list(root.iterdir())[:50]:
                  print(p.relative_to(root))

              raise SystemExit(
                  "ERROR: Android Gradle project not found. "
                  "Upload the full Android source ZIP."
              )

          project = projects[0]
          print("PROJECT FOUND:", project)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("PROJECT_DIR=" + str(project) + "\n")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  "Android project: `" + str(project) + "`\n"
              )
          PY

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartToolboxPro-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
