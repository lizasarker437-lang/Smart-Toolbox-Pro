
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(
              os.environ["GITHUB_WORKSPACE"]
          ).resolve()

          def find_project():
              found = []
              for name in (
                  "settings.gradle",
                  "settings.gradle.kts"
              ):
                  for file in root.rglob(name):
                      folder = file.parent
                      if (
                          (folder / "app/build.gradle").exists()
                          or
                          (folder / "app/build.gradle.kts").exists()
                      ):
                          found.append(folder)
              return sorted(
                  set(found),
                  key=lambda p: (len(p.parts), str(p))
              )

          projects = find_project()
          processed = set()

          for round_no in range(5):
              if projects:
                  break

              archives = [
                  p for p in sorted(root.rglob("*.zip"))
                  if p not in processed
              ]

              if not archives:
                  break

              for index, archive in enumerate(archives):
                  processed.add(archive)
                  dest = (
                      root / "_android_extracted"
                      / str(round_no) / str(index)
                  )
                  dest.mkdir(parents=True, exist_ok=True)

                  try:
                      with zipfile.ZipFile(archive) as z:
                          base = dest.resolve()
                          for item in z.infolist():
                              target = (
                                  base / item.filename
                              ).resolve()
                              if not target.is_relative_to(base):
                                  raise ValueError("Unsafe ZIP path")
                          z.extractall(dest)
                  except (zipfile.BadZipFile, ValueError) as e:
                      print("Skipped ZIP:", e)

              projects = find_project()

          if not projects:
              raise SystemExit(
                  "ERROR: Android Gradle project not found"
              )

          project = projects[0]
          print("PROJECT FOUND:", project)

          with open(
              os.environ["GITHUB_ENV"], "a"
          ) as f:
              f.write("PROJECT_DIR=" + str(project) + "\n")
          PY

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          test -n "$SDKMANAGER" || exit 1
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartToolboxPro-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
